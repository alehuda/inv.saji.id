<title>Mockup Inventory Saji</title>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Shippori+Mincho:wght@500;600;700&family=Yuji+Boku&display=swap">
<style>
/* Saji Brand Guideline v26.10: putih sebagai latar, terakota utama, maroon untuk header, sage untuk status baik, emas sebagai aksen. Satu tema terang sesuai panduan. */
:root{
  --terakota:#A94438; --maroon:#792116; --emas:#FCC568; --sage:#325234; --putih:#FFFFFF; --arang:#444444;
  --bg:var(--putih); --surface:var(--putih); --fg:var(--arang); --muted:#6F6F6F; --line:rgba(68,68,68,.18);
  --tint-t:rgba(169,68,56,.09); --tint-s:rgba(50,82,52,.11); --tint-e:rgba(252,197,104,.38); --tint-m:rgba(121,33,22,.09);
  --font-head:"Shippori Mincho","Hiragino Mincho ProN",Georgia,serif;
  --font-body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-accent:"Yuji Boku","Hiragino Mincho ProN",Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-weight:300;font-size:16px;line-height:1.45;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1000px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--font-head);font-weight:600;margin:0;letter-spacing:-.08em;line-height:1;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
b,strong{font-weight:500}
:focus-visible{outline:2px solid var(--terakota);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between}
.logo{display:block;width:150px;height:auto;margin-bottom:14px}
.eyebrow{font-family:var(--font-accent);font-size:17px;letter-spacing:-.08em;line-height:1;color:var(--terakota)}
.top h1{font-size:clamp(34px,6vw,48px);margin-top:10px;color:var(--arang)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctl label,.lab{font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
select,input[type=text],input[type=number],input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%;font-weight:300}
.ctl select{width:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:400}
.btn:hover{border-color:var(--terakota);color:var(--terakota)}
.sample{background:var(--tint-e);color:var(--arang);border-radius:10px;padding:10px 14px;font-size:15px}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
@media (min-width:900px){.grid{grid-template-columns:minmax(0,1fr) 400px}}
.notes{display:flex;flex-direction:column;gap:10px}
.notes h2{font-size:26px;color:var(--maroon)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.note b{display:block;font-weight:500;font-size:17px}
.note span{color:var(--muted);font-size:15px;display:block}
.note .m{font-size:12px;color:var(--terakota);font-weight:500;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.note button{all:unset;cursor:pointer;color:var(--terakota);font-size:14px;font-weight:400;text-decoration:underline;text-underline-offset:3px;margin-top:6px;display:inline-block}
.phone{width:100%;max-width:400px;margin-inline:auto;background:var(--putih);border:1px solid var(--line);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;min-height:700px;position:relative;box-shadow:0 1px 0 rgba(68,68,68,.04)}
.ph-h{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--maroon);color:var(--putih)}
.ph-ico{width:34px;height:auto;display:block;flex:none}
.back:not([hidden]) ~ .ph-ico{display:none}
.ph-h h3{font-size:24px;flex:1;color:var(--putih)}
.back{border:1px solid rgba(255,255,255,.45);background:transparent;color:var(--putih);border-radius:10px;padding:6px 11px;cursor:pointer;font-weight:400}
.scr{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px}
.nav{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line)}
.nav button{border:0;background:transparent;padding:13px 0;font-weight:400;color:var(--muted);cursor:pointer}
.nav button[aria-current="true"]{color:var(--terakota);font-weight:500;box-shadow:inset 0 2px 0 var(--terakota)}
.hello{display:flex;flex-direction:column;gap:4px}
.hello b{font-family:var(--font-head);font-weight:600;font-size:30px;letter-spacing:-.08em;line-height:1;color:var(--maroon)}
.hello span{color:var(--muted);font-size:15px}
.low{background:var(--tint-e);border-radius:12px;padding:10px 13px;font-size:15px;color:var(--arang)}
.low button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-weight:500}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:80px}
.tile:hover{border-color:var(--terakota);background:var(--tint-t)}
.tile b{font-weight:500;font-size:17px;color:var(--maroon)}.tile span{font-size:14px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.row .nm{min-width:0;flex:1}.row .nm b{font-weight:500;display:block}.row .nm span{font-size:14px;color:var(--muted);display:block}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res{display:flex;flex-direction:column;gap:6px}
.res button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;text-align:left;cursor:pointer}
.res button:hover{border-color:var(--terakota)}
.res button[disabled]{opacity:.55;cursor:not-allowed}
.step{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.step input{width:78px;text-align:center}
.step select{width:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:15px;font-weight:300}
.chip[aria-pressed="true"]{background:var(--tint-t);border-color:var(--terakota);color:var(--terakota);font-weight:500}
.primary{background:var(--terakota);color:var(--putih);border:0;border-radius:12px;padding:14px;font-weight:500;cursor:pointer;width:100%}
.primary:hover{background:var(--maroon)}
.ghost{background:var(--surface);border:1px solid var(--terakota);color:var(--terakota);border-radius:12px;padding:12px;font-weight:500;cursor:pointer;width:100%}
.sm{padding:5px 11px;font-size:14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:400}
.sm.ok{background:var(--tint-s);border-color:var(--sage);color:var(--sage);font-weight:500}
.err{color:var(--maroon);background:var(--tint-m);border:1px solid rgba(121,33,22,.28);border-radius:10px;padding:9px 12px;font-size:15px}
.info{color:var(--sage);background:var(--tint-s);border-radius:10px;padding:9px 12px;font-size:15px}
.toast{position:absolute;left:16px;right:16px;bottom:64px;background:var(--arang);color:var(--putih);border-radius:12px;padding:11px 15px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.badge{font-size:13px;border-radius:999px;padding:2px 10px;background:var(--tint-e);color:var(--arang);font-weight:500;white-space:nowrap}
.badge.ok{background:var(--tint-s);color:var(--sage)}
.badge.bad{background:var(--tint-m);color:var(--maroon)}
.diff{font-weight:500;font-variant-numeric:tabular-nums}.diff.neg{color:var(--maroon)}.diff.pos{color:var(--sage)}
.empty{color:var(--muted);font-size:15px;text-align:center;padding:16px 0}
.lg{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec{font-size:12px;font-weight:500;color:var(--terakota);text-transform:uppercase;letter-spacing:.1em;margin-top:6px}
.big{font-family:var(--font-head);font-weight:600;font-size:26px;letter-spacing:-.08em;line-height:1;color:var(--maroon)}
input,select{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* ===== v0.6: tata letak penuh, sidebar use case, tampilan web ===== */
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;padding:0;overflow:hidden}
.shell{display:grid;grid-template-columns:340px minmax(0,1fr);height:100vh;height:100dvh}
.shell.hide{grid-template-columns:minmax(0,1fr)}
.shell.hide .side{display:none}
.side{border-right:1px solid var(--line);overflow:auto;padding:18px 18px 28px;display:flex;flex-direction:column;gap:12px;background:var(--putih);min-width:0}
.side-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.side .logo{width:120px;margin:0}
.side h1{font-size:30px;color:var(--arang);margin-top:2px}
.side .notes h2{font-size:22px}
.main{min-width:0;min-height:0;display:flex}
.phone{flex:1;max-width:none;margin:0;border:0;border-radius:0;min-height:0;min-width:0;container:app/inline-size;box-shadow:none}
.ph-h{flex:none;flex-wrap:nowrap}
.ph-h h3{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;padding-bottom:2px}
.hbtn,.back{border:1px solid rgba(255,255,255,.45);background:transparent;color:var(--putih);border-radius:10px;padding:6px 11px;cursor:pointer;font-weight:400;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.hbtn:hover,.back:hover{background:rgba(255,255,255,.14)}
.ph-r{display:flex;gap:6px;align-items:center;margin-left:auto}
.ph-h select{width:auto;max-width:190px;background:rgba(255,255,255,.12);color:var(--putih);border:1px solid rgba(255,255,255,.45);padding:6px 9px}
.ph-h option{color:var(--arang);background:#fff}
.body{flex:1;min-height:0;display:flex;flex-direction:column}
.scr{flex:1;min-height:0;overflow:auto}
.nav{order:2;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.nav .wide{display:none}
.cards{display:flex;flex-direction:column;gap:8px}
.tbl-wrap{display:none}
.toast{bottom:76px}
.chk{display:flex;gap:8px;align-items:center;font-size:15px;text-transform:none;letter-spacing:0;color:var(--arang);font-weight:300}
@media (max-width:899px){
 .shell,.shell.hide{grid-template-columns:minmax(0,1fr)}
 .side{position:fixed;inset:0 auto 0 0;width:min(340px,88vw);z-index:20;box-shadow:0 0 0 100vmax rgba(68,68,68,.35)}
}
@container app (max-width:560px){
 .ph-ico{display:none!important}
 .ph-h{flex-wrap:wrap}
 .ph-r{width:100%;margin-left:0}
 .ph-r select{flex:1;max-width:none}
}
@container app (min-width:760px){
 .body{flex-direction:row}
 .nav{order:0;width:220px;flex:none;display:flex;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:12px 8px;gap:2px;overflow:auto;background:#FBF8F7}
 .nav .wide{display:block}
 .nav button{text-align:left;padding:10px 14px;border-radius:10px}
 .nav button[aria-current="true"]{box-shadow:none;background:var(--tint-t)}
 .scr{padding:24px 28px;gap:14px}
 .scr.form{align-items:center}
 .scr.form > *{width:100%;max-width:880px}
 .scr.form > .primary{max-width:340px}
 .scr.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));align-content:start}
 .scr.list > *:not(.card){grid-column:1/-1}
 .scr.list > .primary{justify-self:start;width:auto;padding-inline:28px}
 .scr.homec .tiles{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
 .cards{display:none}
 .tbl-wrap{display:block;overflow:auto;border:1px solid var(--line);border-radius:14px}
 .tbl{width:100%;border-collapse:collapse;font-size:15px}
 .tbl th{text-align:left;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;background:var(--tint-t);color:var(--maroon);padding:10px 12px;white-space:nowrap}
 .tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
 .tbl tr[data-open]{cursor:pointer}
 .tbl tr[data-open]:hover td{background:var(--tint-t)}
 .tbl td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
 .tbl tr.dt td{background:#FBF8F7}
 .tbl .xl{display:none}
 .toast{bottom:24px;left:auto;right:24px;max-width:420px}
}
@container app (min-width:1000px){.tbl .xl{display:table-cell}}
@container app (min-width:1100px){.scr.list{grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}}

/* ===== padat ===== */
body{font-size:14.5px;line-height:1.35}
.ph-h{padding:9px 12px;gap:8px}
.ph-h h3{font-size:20px}
.ph-ico{width:26px}
.hbtn,.back{padding:4px 9px;font-size:13.5px}
.ph-h select{padding:4px 8px;font-size:13.5px}
.scr{padding:12px;gap:8px}
.card{padding:9px 11px;gap:3px;border-radius:12px}
.cards{gap:6px}
.tiles{gap:8px}
.tile{min-height:60px;padding:10px 12px;border-radius:12px}
.tile b{font-size:15.5px}.tile span{font-size:13px}
.hello b{font-size:24px}.hello span{font-size:13.5px}
.low,.info,.err{padding:7px 10px;font-size:13.5px}
.row .nm span,.note span{font-size:13px}
.field{gap:3px}
.field label,.lab,.sec{font-size:11px}
.sec{margin-top:2px}
select,input[type=text],input[type=number],input[type=date]{padding:6px 9px;border-radius:9px}
.primary{padding:10px}.ghost{padding:9px}
.sm{padding:3px 9px;font-size:13px}
.chip{padding:4px 11px;font-size:13.5px}
.chips{gap:5px}
.badge{font-size:12px;padding:1px 8px}
.two{gap:6px}
.res button{padding:6px 9px}
.nav button{padding:9px 0;font-size:14px}
.big{font-size:22px}
.note{padding:10px 12px}.note b{font-size:15px}
.side{padding:14px;gap:9px}
.toast{padding:8px 12px;font-size:13.5px}
.sticky{position:sticky;top:-12px;z-index:6;background:var(--putih);margin:-12px -12px 0;padding:10px 12px 8px;border-bottom:1px solid var(--line)}
@container app (min-width:760px){
 .scr{padding:14px 18px;gap:10px}
 .sticky{top:-14px;margin:-14px -18px 0;padding:12px 18px 8px;max-width:none!important}
 .nav{padding:8px 6px;gap:1px;width:190px}
 .nav button{padding:7px 12px;font-size:14px}
 .tbl{font-size:13.5px}
 .tbl th{padding:7px 10px}
 .tbl td{padding:6px 10px}
 .scr.list{gap:8px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
 .scr.form > *{max-width:820px}
}
@container app (min-width:1100px){.scr.list{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}}

/* ===== v0.7: topbar hitam, header app, beranda per peran ===== */
.shell{grid-template-rows:auto minmax(0,1fr)}
.topbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#141414;color:#fff;padding:7px 14px}
.tb-l{display:flex;align-items:center;gap:8px;min-width:0}
.tb-l label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#aaa;font-weight:500}
.topbar select{width:auto;min-width:190px;max-width:270px;background:#262626;color:#fff;border:1px solid #555;border-radius:9px;padding:5px 9px;font-size:14px}
.topbar option{color:#222;background:#fff}
.tb-r{display:flex;gap:6px}
.tbtn{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:9px;padding:5px 11px;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.14)}
.who{margin-left:auto;font-size:12.5px;background:rgba(255,255,255,.14);padding:3px 10px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}
.nav .grp{display:none}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--terakota);font-weight:500;padding:10px 12px 3px}
.hg{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--terakota);font-weight:500;margin-top:4px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:var(--tint-t);border-radius:12px;padding:8px 11px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-head);font-size:24px;letter-spacing:-.08em;line-height:1;color:var(--maroon);font-weight:600}
.stat span{font-size:12.5px;color:var(--muted)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
@media (max-width:899px){.side{inset:44px auto 0 0}}
@container app (min-width:760px){.nav .grp{display:block}.nav .narrow{display:none}}
@container app (max-width:420px){.who{display:none}}

/* ===== v0.8: tabel hasil opname ===== */
.tbl2-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
.tbl2{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl2 th{text-align:left;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;background:var(--tint-t);color:var(--maroon);padding:7px 10px;white-space:nowrap}
.tbl2 td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:top}
.tbl2 td.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl2 tr[data-go]{cursor:pointer}.tbl2 tr[data-go]:hover td{background:var(--tint-t)}
.tbl2 tr.sel td{background:var(--tint-e)}
.trail{font-size:12.5px;color:var(--muted);padding-left:10px;border-left:2px solid var(--line)}

/* ===== v0.9: daftar item, bantuan, kalender ===== */
.hlp{width:16px;height:16px;border-radius:50%;border:1px solid var(--muted);background:#fff;color:var(--muted);font-size:11px;font-weight:600;line-height:1;margin-left:6px;cursor:pointer;padding:0;vertical-align:middle;display:inline-flex;align-items:center;justify-content:center;text-transform:none;letter-spacing:0;font-family:var(--font-body)}
.hlp:hover,.hlp:focus-visible{color:var(--terakota);border-color:var(--terakota)}
.pop,.cal{position:absolute;z-index:40;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.pop{max-width:290px;padding:10px 12px;font-size:13.5px}
.pop b{display:block;font-weight:500;color:var(--maroon);margin-bottom:2px}.pop p{margin:0;color:var(--arang);line-height:1.4}
.cal{width:262px;padding:10px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.calh b{font-weight:500}
.calh button,.calf button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 10px;cursor:pointer;font-size:15px}
.calf{display:flex;justify-content:space-between;margin-top:8px}.calf button{font-size:13px;color:var(--terakota)}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cw{font-size:11px;color:var(--muted);padding:3px 0;text-transform:uppercase}
.cd{border:0;background:transparent;border-radius:8px;padding:6px 0;cursor:pointer;font-size:13.5px;font-variant-numeric:tabular-nums}
.cd:hover{background:var(--tint-t)}.cd.td{box-shadow:inset 0 0 0 1px var(--terakota)}.cd.on{background:var(--terakota);color:#fff}
.dtw{position:relative;display:flex;align-items:center}
.dtw .dtv{padding-right:34px;cursor:pointer;background:#fff}
.dti{position:absolute;right:6px;border:0;background:transparent;color:var(--terakota);cursor:pointer;padding:4px;display:inline-flex}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{border:1px solid var(--line);background:#fff;border-radius:8px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--arang);padding:0}
.ib:hover,.ib:focus-visible{border-color:var(--terakota);color:var(--terakota);background:var(--tint-t)}
.ib.ok{color:var(--sage)}.ib.ok:hover{border-color:var(--sage);background:var(--tint-s)}.ib.bad:hover{color:var(--maroon);border-color:var(--maroon);background:var(--tint-m)}
.ics{display:flex;gap:4px;flex-wrap:wrap}

function canEditItem(it){if(!it||it.wip)return false;if(can("item"))return true;if(!can("itemEdit"))return false;if(role==="manajer")return true;return (it.depts||[]).indexOf(DEPOF[R().div])>-1;}
function byId(a,id){return a.filter(function(x){return x.id===id;})[0];}
function num(n){return Number(Math.round(n*100)/100).toLocaleString("id-ID");}
function rp(n){return (n<0?"-":"")+"Rp"+Math.round(Math.abs(n)).toLocaleString("id-ID");}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function now(){return new Date().toTimeString().slice(0,5);}
function tot(it){return LOCS.reduce(function(a,l){return a+it.st[l];},0);}
function ppb(it){return it.wip?it.ppb:((it.price&&it.beli)?it.price.perBeli/it.beli.isi:0);}
function units(it){
 var u=[{l:it.bu,f:1}];
 if(it.bund&&it.bund.u.toLowerCase()!==it.bu)u.push({l:it.bund.u,f:it.bund.isi});
 if(it.beli&&!(it.bund&&it.bund.u===it.beli.u&&it.bund.isi===it.beli.isi)&&it.beli.u.toLowerCase()!==it.bu)u.push({l:it.beli.u,f:it.beli.isi});
 return u;
}
function fmtStock(it,q){
 if(it.bund&&it.bund.isi>0){var utuh=Math.floor(q/it.bund.isi+1e-9),sisa=Math.round((q-utuh*it.bund.isi)*100)/100;
  return utuh+" "+it.bund.u.toLowerCase()+(sisa>0?" + "+num(sisa)+" "+it.bu:"")+" ("+num(q)+" "+it.bu+")";}
 return num(q)+" "+it.bu;
}
function lev(a,b){var m=[],i,j;for(i=0;i<=a.length;i++)m[i]=[i];for(j=0;j<=b.length;j++)m[0][j]=j;for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length];}
function find(q,list){
 q=q.trim().toLowerCase();if(!q)return [];
 return list.filter(function(it){
  return [it.name,it.panggil].concat(it.alias||[]).map(function(s){return s.toLowerCase();}).some(function(n){
   return n.indexOf(q)>-1||n.split(/\s+/).some(function(w){return q.length>=4&&lev(q,w.slice(0,q.length))<=1;});
  });
 });
}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("on");},2400);}

/* --- Purchase Update --- */
var BQ={q:"",sort:"tgl",dir:-1,st:[],jenis:"Semua",div:"Semua",page:1,size:25,more:25};
var BST=["Diajukan","Disetujui","Dibeli sebagian","Dibeli","Ditolak","Tidak jadi dibeli"];
function lnStatus(l){if(l.approval==="Ditolak")return "Ditolak";if(l.status==="Diminta")return l.approval==="Disetujui"?"Disetujui":"Diajukan";return l.status;}
function stCls(st){return st==="Dibeli"?"ok":((st==="Ditolak"||st==="Tidak jadi dibeli")?"bad":"");}
function bRows(){
 var rows=[];
 prs.forEach(function(p){p.lines.forEach(function(l){var it=l.item?byId(items,l.item):null;rows.push({key:"pr:"+p.id+":"+l.id,jenis:"PR",kode:p.kode,tgl:p.tgl,itemTxt:it?it.panggil:l.free,qty:l.qty,u:l.u,oleh:p.peminta,div:p.div,sup:l.sup||"",dest:l.dest||"",harga:l.harga||null,status:lnStatus(l),p:p,l:l});});});
 buys.forEach(function(b){b.lines.forEach(function(l,i){var it=byId(items,l.item);rows.push({key:"bl:"+b.id+":"+i,jenis:"Langsung",kode:b.kode,tgl:b.tgl,itemTxt:it?it.panggil:"(item dihapus)",qty:l.qty,u:l.u,oleh:b.oleh,div:b.div,sup:b.sup,dest:b.dest,harga:l.hg,status:"Dibeli",b:b,bl:l});});});
 return rows;
}
function bVisible(r){return can("pu")||role==="manajer"||role==="cfo"||role==="stafpurch"||r.div===R().div||r.oleh===R().n;}
function bFilter(skipSt){
 var q=BQ.q.trim().toLowerCase();
 return bRows().filter(function(r){
  if(!bVisible(r))return false;
  if(q&&(r.itemTxt+" "+r.kode+" "+r.oleh+" "+r.sup).toLowerCase().indexOf(q)<0)return false;
  if(BQ.jenis!=="Semua"&&r.jenis!==BQ.jenis)return false;
  if(BQ.div!=="Semua"&&r.div!==BQ.div)return false;
  if(!skipSt&&BQ.st.length&&BQ.st.indexOf(r.status)<0)return false;
  return true;
 });
}
function bVal(r,k){switch(k){case "status":return BST.indexOf(r.status);case "qty":return r.qty;case "harga":return r.harga==null?null:r.harga;default:return String(r[k]==null?"":r[k]).toLowerCase();}}
function bActs(r){
 var h="";
 if(r.jenis==="PR"&&isOpen(r.l)&&r.l.approval!=="Ditolak"){
  if(can("approve")&&!r.l.approval)h+=ib("okk","Setujui",'data-ap="'+r.p.id+':'+r.l.id+':Disetujui"',"ok")+ib("x","Tolak",'data-ap="'+r.p.id+':'+r.l.id+':Ditolak"',"bad");
  if(can("pu"))h+=ib("cart","Catat pembelian",'data-go="puForm" data-p="'+r.p.id+':'+r.l.id+'"');
 }
 return h;
}
function renderBel(){
 var k=BQ.sort,d=BQ.dir,pr=R().price,showAct=can("approve")||can("pu");
 var arr=bFilter(false).sort(function(a,b){var x=bVal(a,k),y=bVal(b,k),ex=(x===""||x==null),ey=(y===""||y==null);if(ex&&ey)return 0;if(ex)return 1;if(ey)return -1;return (typeof x==="number"?x-y:String(x).localeCompare(String(y),"id"))*d;});
 var n=arr.length,pages=Math.max(1,Math.ceil(n/BQ.size));if(BQ.page>pages)BQ.page=pages;if(BQ.page<1)BQ.page=1;
 var st=(BQ.page-1)*BQ.size,slice=arr.slice(st,st+BQ.size),cs=arr.slice(0,BQ.more),base=bFilter(true);
 var cols=[["tgl","Tanggal"],["kode","Kode"],["jenis","Jenis"],["itemTxt","Item"],["qty","Jumlah"],["oleh","Pengaju"]].concat(pr?[["harga","Harga satuan"]]:[]).concat([["status","Status"]]);

 var rows=slice.map(function(r){return '<tr data-bview="'+r.key+'"><td class="stk1">'+esc(fmtDate(r.tgl))+'</td><td>'+esc(r.kode)+'</td><td>'+esc(r.jenis)+'</td><td><b>'+esc(r.itemTxt)+'</b></td><td class="r">'+num(r.qty)+' '+esc(r.u)+'</td><td>'+esc(r.oleh)+'</td>'+(pr?'<td class="r">'+(r.harga?rp(r.harga)+' / '+esc(r.u):'-')+'</td>':'')+'<td><span class="badge '+stCls(r.status)+'">'+esc(r.status)+'</span></td>'+(showAct?'<td class="stk2"><div class="ics">'+bActs(r)+'</div></td>':'')+'</tr>';}).join("");
 var cards=cs.map(function(r){return '<div class="card" data-bview="'+r.key+'" style="cursor:pointer"><div class="row"><div class="nm"><b>'+esc(r.itemTxt)+'</b><span>'+num(r.qty)+' '+esc(r.u)+' · '+esc(r.kode)+' · '+esc(r.jenis)+'</span><span>'+esc(r.oleh)+' · '+esc(fmtDate(r.tgl))+'</span></div><span class="badge '+stCls(r.status)+'">'+esc(r.status)+'</span></div>'+(showAct&&bActs(r)?'<div class="ics">'+bActs(r)+'</div>':'')+'</div>';}).join("")+(cs.length<n?'<button type="button" class="ghost" data-bmore="1">Muat lebih banyak ('+(n-cs.length)+' lagi)</button>':'');
 $("blist").innerHTML=n?'<div class="cards">'+cards+'</div><div class="tbl-wrap"><table class="bt"><thead><tr>'+th+'</tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="empty">Tidak ada data belanja untuk filter ini.</div>';
 $("bchips").innerHTML=BST.map(function(x){var c=base.filter(function(r){return r.status===x;}).length;return '<button type="button" class="chip" data-bst="'+esc(x)+'" aria-pressed="'+(BQ.st.indexOf(x)>-1)+'">'+esc(x)+' <i style="font-style:normal;color:var(--muted)">'+c+'</i></button>';}).join("");
 $("bcnt").textContent=n+" baris";
 $("bpager").innerHTML=n?'<span>'+(st+1)+'–'+Math.min(st+BQ.size,n)+' dari '+n+'</span><span class="sp"><label>Baris <select id="bpgsize">'+[25,50,100].map(function(x){return '<option'+(x===BQ.size?' selected':'')+'>'+x+'</option>';}).join("")+'</select></label><button type="button" class="sm" data-bpg="-1"'+(BQ.page<=1?' disabled':'')+' aria-label="Halaman sebelumnya">‹</button><span>Hal '+BQ.page+' / '+pages+'</span><button type="button" class="sm" data-bpg="1"'+(BQ.page>=pages?' disabled':'')+' aria-label="Halaman berikutnya">›</button></span>':'';
}

var MQ={q:"",sort:"panggil",dir:1,st:[],all:false,page:1,size:25};
var MST=["Aman","Menipis","Habis","Tanpa batas"];
function stokState(it){var t=tot(it);if(it.min>0){if(t<=0)return "Habis";if(t<it.min)return "Menipis";return "Aman";}return "Tanpa batas";}
function stCls2(x){return x==="Aman"?"ok":((x==="Menipis"||x==="Habis")?"bad":"");}
function mBase(){var q=MQ.q.trim();var a=q?find(q,items):items;return a.filter(function(i){return !i.wip&&(MQ.all||tot(i)>0||i.min>0);});}
function mVal(i,k){switch(k){case "panggil":return (i.panggil||"").toLowerCase();case "tipe":return i.tipe;case "total":return tot(i);case "min":return i.min;case "status":return MST.indexOf(stokState(i));case "nilai":return R().price?tot(i)*ppb(i):null;case "upd":return lastUpd(i)||"";default:return i.st[k]==null?0:i.st[k];}}
function mList(){var k=MQ.sort,d=MQ.dir;return mBase().filter(function(i){return !MQ.st.length||MQ.st.indexOf(stokState(i))>-1;}).sort(function(a,b){var x=mVal(a,k),y=mVal(b,k);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return (typeof x==="number"?x-y:String(x).localeCompare(String(y),"id"))*d;});}
function mActs(it){return ib("eye","Lihat detail stok",'data-mview="'+it.id+'"')+(can("min")?ib("edit","Atur batas minimum",'data-mmin="'+it.id+'"'):"");}
function renderMon(){
 var arr=mList(),n=arr.length,pages=Math.max(1,Math.ceil(n/MQ.size)),pr=R().price;if(MQ.page>pages)MQ.page=pages;if(MQ.page<1)MQ.page=1;
 var st=(MQ.page-1)*MQ.size,slice=arr.slice(st,st+MQ.size),base=mBase();
 var nilai=base.reduce(function(a,i){return a+tot(i)*ppb(i);},0);
 $("mstats").innerHTML='<div class="stat"><b>'+base.length+'</b><span>Item dipantau</span></div><div class="stat"><b>'+base.filter(function(i){return stokState(i)==="Menipis";}).length+'</b><span>Menipis</span></div><div class="stat"><b>'+base.filter(function(i){return stokState(i)==="Habis";}).length+'</b><span>Habis</span></div>'+(pr?'<div class="stat"><b>'+rp(nilai)+'</b><span>Nilai stok</span></div>':'');
 var mx="";base.forEach(function(i){var u=lastUpd(i);if(u>mx)mx=u;});$("mupd").textContent="Data stok diperbarui terakhir: "+fmtDT(mx);

 ["items","kitchen","Head mengubah item","Head dan Manager bisa membuka Daftar Item dan mengubah item lewat ikon Edit. Head hanya bisa mengubah item yang dipakai oleh divisinya (kolom Dipakai oleh). Membuat, menonaktifkan, dan menghapus item tetap tugas Purchasing."],
  ["items","bar","Head mengubah item","Head dan Manager bisa membuka Daftar Item dan mengubah item lewat ikon Edit. Head hanya bisa mengubah item yang dipakai oleh divisinya (kolom Dipakai oleh). Membuat, menonaktifkan, dan menghapus item tetap tugas Purchasing."],
  ["items","manajer","Manager mengubah item","Manager bisa mengubah semua item lewat ikon Edit. Membuat, menonaktifkan, dan menghapus item tetap tugas Purchasing."],
  ["prNew","kitchen","Use case 2 · Head mengajukan PR","Purchase Request bisa dibuat oleh level Head (Kitchen, Bar, Experience) dan Manager. CFO dan level Staff tidak membuat PR. Head memantau statusnya di Daftar Belanja (Diajukan, Disetujui, Ditolak, Dibeli sebagian, Dibeli, Tidak jadi dibeli) beserta jejaknya."],
 ["puList","cfo","Use case 2 · Daftar Belanja","Satu tabel untuk semua belanja (sekitar 150 baris data contoh, dibagi halaman): PR dari pengajuan sampai dibeli (termasuk ditolak dan tidak jadi dibeli) dan belanja langsung. Status bisa diurutkan dan difilter, riwayat tetap ada. Klik baris untuk detail lengkap (supplier, divisi, tujuan) dan jejak. Peran tanpa aksi (Manager, Head) tidak melihat kolom Aksi. CFO menyetujui atau menolak (ikon centang dan silang), semua peran Purchasing mencatat pembelian (ikon keranjang)."],
 ["blNew","staf","Belanja Langsung (semua level)","Menu input sendiri untuk laporan belanja yang sudah terjadi: belanja ke pasar atau minimarket tanpa PR. Boleh diinput belakangan dan oleh semua level (coba sebagai Staff Kitchen). Isi tanggal, tempat, item, jumlah, dan harga per satuan. Stok tujuan bertambah dan masuk Daftar Belanja sebagai jenis Langsung."],
 ["resepNew","manajer","Resep","Head hanya bisa membuat resep untuk divisinya. Harga jual hanya muncul untuk Manager. COGS dan margin dihitung otomatis."],
 ["resepList","manajer","Ubah resep dan ganti merek","Di Resep, klik Ubah resep pada sebuah menu. Pada baris bahan, Ganti merek memilih SKU baru (kategori dan satuan dasar sama) dan bisa diterapkan ke semua resep yang memakai SKU lama. SKU lama menjadi Nonaktif jika tidak lagi dipakai resep mana pun. Coba Susu UHT di Caramel Latte."],
 ["pakai","kitchen","Pemakaian dan Ambil dari gudang","Pemakaian hanya dari penyimpanan divisi. Pilih Gudang di 'Dipakai' untuk melihat penolakan. 'Ambil dari gudang' memindahkan stok ke divisi."],
 ["waste","kitchen","Waste","Alasan dipilih dari daftar, stok lokasi berkurang."],
 ["opnameStart","auditor","Use case 3 · Tim menghitung stok","Item yang tampil mengikuti kolom Dipakai oleh (Dapur: Kitchen, Bar: Bar, Exp: Experience, Gudang: semua item bersaldo). Auditor dari divisi lain menghitung item saja (bahan, alat, supplies; aset tidak termasuk). Kolom cari menempel di atas. Stok tercatat tersembunyi sampai hitungan diisi. Botol terbuka dicatat lewat kolom Sisa. Selesai dihitung dikirim ke Head divisi untuk disetujui."],
 ["opnameList","kitchen","Use case 3 · Head menyetujui","Head divisi yang diopname meninjau selisih, lalu Setujui (stok disesuaikan) atau Kembalikan untuk hitung ulang dengan catatan. Head Kitchen hanya bisa menyetujui Dapur, bukan Bar. Gudang disetujui CFO. Coba sesi Dapur yang sedang menunggu."],
 ["opnameLaporan","manajer","Use case 3 · Laporan opname","Manager dan Purchasing melihat laporan per periode dan lokasi: item dihitung, berselisih, dan nilai selisih (hanya peran yang boleh melihat harga), bisa difilter dan diunduh sebagai CSV. Staff Purchasing tidak melihat nilai."],
 ["home","staf","Akses level Staff","Staff (dapur, Warehouse, Purchasing) tidak bisa mengajukan PR dan tidak melihat harga, tetapi boleh Belanja Langsung dan mengisi harga belanjanya."],
 ["pantau","manajer","Monitoring Stock","Tabel stok per lokasi dengan status (Aman, Menipis, Habis, Tanpa batas), nilai, dan kolom Pembaruan terakhir (tanggal dan waktu; di atas tabel ada waktu pembaruan terbaru). Batas minimum hanya di detail (peran yang boleh melihat harga). Bisa dicari, diurutkan, difilter, dan dibagi halaman. Stok tidak diedit langsung (berubah lewat belanja, pemakaian, waste, opname); yang bisa diubah hanya batas minimum oleh Manager dan Head lewat ikon pensil."],
 ["home","staf","Beri masukan","Tombol Masukan di bar atas (di sebelah Use case) membuka formulir. Halaman yang sedang Anda buka, peran, perangkat, peramban, dan aktivitas terakhir terisi otomatis. Pilih jenis dan tingkat, tulis masukan, lampirkan tangkapan layar bila ada, lalu Kirim. Di inv.saji.id/sandbox masukan tersimpan di server. Di tautan lain, teksnya bisa disalin dan dikirim manual."],
 ["items","stafpurch","Tampilan web untuk Purchasing","Di layar lebar, menu pindah ke sisi kiri dan daftar item tampil sebagai tabel. Perkecil jendela untuk melihat tampilan ponsel. Sembunyikan panel ini lewat tombol Sembunyikan."]
];
function renderNotes(){
 $("notes").innerHTML='<h2>Yang bisa dicoba</h2>'+NOTES.map(function(n,i){return '<div class="note"><span class="m">Peran: '+esc(ROLES[n[1]].n)+'</span><b>'+esc(n[2])+'</b><span>'+esc(n[3])+'</span><button type="button" data-n="'+i+'">Buka layar ini</button></div>';}).join("");
}
$("notes").addEventListener("click",function(e){
 var b=e.target.closest("[data-n]");if(!b)return;
 var n=NOTES[+b.dataset.n];role=n[1];$("role").value=role;hist=["home"];show(n[0]);
 if(window.innerWidth<900)sbSet(false);
});

/* ---------- boot ---------- */
$("fbBtn").addEventListener("click",openFeedback);
$("fbdlg").addEventListener("click",function(e){
 var t=e.target;
 if(t.id==="fbdlg"){fbSave();fbClose();return;}
 if(t.closest("[data-fbx]")){fbSave();fbClose();return;}
 var j=t.closest("[data-fbj]");if(j){FB.jenis=j.dataset.fbj;FB.tingkat=FB.jenis==="Pujian"?"":FB.tingkat;$("fb-jenis").querySelectorAll(".chip").forEach(function(b){b.setAttribute("aria-pressed",String(b===j));});$("fb-jenis").classList.remove("invalid");$("fb-tw").hidden=FB.jenis==="Pujian";fbSave();return;}
 var tk=t.closest("[data-fbt]");if(tk){FB.tingkat=tk.dataset.fbt;$("fb-tingkat").querySelectorAll(".chip").forEach(function(b){b.setAttribute("aria-pressed",String(b===tk));});$("fb-tingkat").classList.remove("invalid");fbSave();return;}
 if(t.id==="fb-rm"){FB.foto=null;var im=$("fb-foto-img");im.hidden=true;$("fb-rm").hidden=true;$("fb-foto").value="";return;}
 if(t.closest("[data-fbsend]")){fbSend();return;}
 if(t.closest("[data-fbnew]")){FB.jenis="";FB.tingkat="";FB.foto=null;FB.ctx=fbCtx();renderFb(fbLoad());return;}
 if(t.closest("[data-fbback]")){renderFb(fbLoad());return;}
 if(t.closest("[data-fbretry]")){var p=FB.pending;if(p){renderFb(fbLoad());fbSend();}return;}
 if(t.closest("[data-fbcopy]")){var tx=$("fb-cpy").textContent;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tx).then(function(){toast("Teks disalin");},function(){toast("Salin manual: blok teks lalu salin");});}else{var rg=document.createRange();rg.selectNodeContents($("fb-cpy"));var sl=window.getSelection();sl.removeAllRanges();sl.addRange(rg);toast("Teks terpilih, tekan salin");}return;}
});
$("fbdlg").addEventListener("input",function(e){var t=e.target;if(t.classList&&t.classList.contains("invalid"))t.classList.remove("invalid");fbSave();});
$("fbdlg").addEventListener("change",function(e){var t=e.target;
 if(t.id==="fb-sk"){fbSave();return;}
 if(t.id==="fb-foto"){var fl=t.files&&t.files[0];if(!fl)return;if(fl.size>10*1024*1024){toast("Gambar terlalu besar (maksimal 10 MB).");t.value="";return;}readShot(fl,function(d){if(!d){toast("Gambar tidak bisa dibaca.");return;}FB.foto=d;var im=$("fb-foto-img");im.src=d;im.hidden=false;$("fb-rm").hidden=false;});}
});
$("phone").addEventListener("mouseover",function(e){var t=e.target.closest&&e.target.closest("[data-tip]");if(t)showTip(t);else hideTip();});
$("phone").addEventListener("mouseleave",hideTip);
$("phone").addEventListener("focusin",function(e){var t=e.target.closest&&e.target.closest("[data-tip]");if(t)showTip(t);});
$("phone").addEventListener("focusout",hideTip);
$("scr").addEventListener("scroll",hideTip,true);
var OBS=new MutationObserver(function(){OBS.disconnect();try{decorate();}finally{OBS.observe($("scr"),{childList:true,subtree:true});}});
OBS.observe($("scr"),{childList:true,subtree:true});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){$("pop").hidden=true;$("cal").hidden=true;closeModal();if(!$("fbdlg").hidden){fbSave();fbClose();}}});
var shell=$("shell");
function sbSet(open){shell.classList.toggle("hide",!open);$("sideToggle").setAttribute("aria-expanded",String(open));}
function sbIsOpen(){return !shell.classList.contains("hide");}
$("sideToggle").addEventListener("click",function(){sbSet(!sbIsOpen());});
$("hideSide").addEventListener("click",function(){sbSet(false);});
$("role").innerHTML='<option value="">Pilih akun / role</option>'+Object.keys(ROLES).map(function(k){return '<option value="'+k+'"'+''+'>'+ROLES[k].n+'</option>';}).join("");
$("role").addEventListener("change",function(){LQ.q="";role=this.value;enter();});
$("reset").addEventListener("click",function(){
 var run=function(){seed();hist=[];show("home");toast("Data contoh dikembalikan");if(SY.on){SY.busy=true;syPush(true).catch(function(){}).then(function(){SY.busy=false;});}};
 if(SY.on)askConfirm("Reset data ruang "+SY.room,"Semua perangkat di ruang ini ikut kembali ke data contoh.","Reset",run,true);else run();
});
$("syncBtn").addEventListener("click",function(){var n=window.prompt("Nama ruang (huruf kecil, angka, strip). Perangkat dengan nama ruang sama berbagi data.",SY.room);if(n===null)return;n=n.trim().toLowerCase();if(!/^[a-z0-9-]{1,24}$/.test(n)){toast("Nama ruang tidak valid");return;}try{localStorage.setItem("saji-room",n);}catch(e){}location.href=location.pathname+"?ruang="+n;});
seed();renderNotes();show("home");sbSet(window.innerWidth>=900);syStart();
})();
</script>
