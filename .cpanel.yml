# Dijalankan cPanel setiap kali "Deploy HEAD Commit" di Git Version Control.
deployment:
  tasks:
    - export DEPLOYPATH=/home/sajiid/public_html/inv/sandbox/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp index.html $DEPLOYPATH
    - /bin/cp .htaccess $DEPLOYPATH
    - /bin/cp feedback.php $DEPLOYPATH
    - /bin/cp feedback-admin.php $DEPLOYPATH
    - /bin/cp sync.php $DEPLOYPATH
    - export LIVEPATH=/home/sajiid/public_html/inv/
    - /bin/mkdir -p $LIVEPATH/item
    - /bin/cp live/index.html $LIVEPATH
    - /bin/cp live/item/index.html $LIVEPATH/item/
    - /bin/cp .htaccess $LIVEPATH
    - /bin/cp feedback.php $LIVEPATH
    - /bin/cp sync.php $LIVEPATH
    - export APIPATH=/home/sajiid/public_html/inv/api/
    - /bin/mkdir -p $APIPATH
    - /bin/cp -R api/. $APIPATH
    - export CFGPATH=/home/sajiid/inv-config
    - /bin/mkdir -p $CFGPATH
    - /bin/cp seed/items.json $CFGPATH/seed-items.json
    - /bin/chmod 600 $CFGPATH/seed-items.json
